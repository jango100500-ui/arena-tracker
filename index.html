<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>SWGOH Arena Tracker</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    body {

      margin: 0;
      padding: 24px 16px;

      background: #111318;
      color: #ffffff;

      font-family: Arial, sans-serif;

    }


    .container {

      max-width: 600px;
      margin: 0 auto;

    }


    h1 {

      margin: 0 0 8px;
      font-size: 26px;

    }


    .subtitle {

      color: #9da3ad;
      margin-bottom: 24px;

    }


    input {

      width: 100%;

      padding: 14px;

      border: 1px solid #343942;
      border-radius: 10px;

      background: #1b1e24;
      color: white;

      font-size: 16px;

      outline: none;

    }


    input:focus {

      border-color: #666d78;

    }


    .buttons {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top: 12px;

    }


    button {

      padding: 13px 10px;

      border: 0;
      border-radius: 10px;

      background: #2a2f38;
      color: white;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    .status {

      min-height: 22px;

      margin-top: 16px;

      color: #9da3ad;

      font-size: 14px;

    }


    .arena-card {

      display: none;

      margin-top: 20px;

      padding: 18px;

      border-radius: 14px;

      background: #1b1e24;

      border: 1px solid #30343c;

    }


    .player-header {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 12px;

      margin-bottom: 18px;

    }


    .player-name {

      font-size: 21px;
      font-weight: 700;

    }


    .rank {

      font-size: 24px;
      font-weight: 700;

    }


    .rank-label {

      color: #8f96a1;

      font-size: 12px;

      text-align: right;

    }


    .squad-title {

      margin-bottom: 14px;

      color: #9da3ad;

      font-size: 13px;

    }


    .squad {

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 10px;

    }


    .character {

      min-width: 0;
      text-align: center;

    }


    .portrait {

      width: 100%;

      aspect-ratio: 1 / 1;

      display: block;

      object-fit: cover;

      border-radius: 50%;

      background: #292d35;

      border: 2px solid #4a505b;

    }


    .portrait.loading {

      opacity: 0.35;

      animation:
        pulse 1.2s infinite;

    }


    .portrait.error {

      opacity: 0.25;

    }


    @keyframes pulse {

      0% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.8;
      }

      100% {
        opacity: 0.3;
      }

    }


    .character-name {

      margin-top: 6px;

      color: #c8ccd3;

      font-size: 10px;

      line-height: 1.15;

      word-break: break-word;

    }


    /* =====================================================
       DEBUG
    ===================================================== */

    .debug-button {

      width: 100%;

      margin-top: 20px;

      padding: 10px;

      background: #191c22;

      border: 1px solid #30343c;

      color: #8f96a1;

      font-size: 12px;

      text-align: left;

    }


    .debug-panel {

      display: none;

      margin-top: 8px;

      border-radius: 10px;

      background: #090b0e;

      border: 1px solid #292d34;

      overflow: hidden;

    }


    .debug-header {

      padding: 10px 12px;

      color: #8f96a1;

      font-size: 11px;

      border-bottom:
        1px solid #292d34;

      font-weight: 700;

    }


    .debug-content {

      max-height: 320px;

      overflow-y: auto;

      padding: 10px 12px;

      font-family:
        monospace;

      font-size: 10px;

      line-height: 1.55;

      color: #aeb4be;

      white-space: pre-wrap;

      word-break: break-word;

    }


    .debug-entry {

      padding-bottom: 3px;

    }


    .debug-success {

      color: #8bcf9a;

    }


    .debug-error {

      color: #e88787;

    }


    .debug-title {

      margin-top: 10px;

      margin-bottom: 4px;

      color: #ffffff;

      font-weight: 700;

    }


    /* =====================================================
       JSON
    ===================================================== */

    .json-section {

      margin-top: 20px;

    }


    .json-section button {

      width: 100%;

      margin-bottom: 10px;

    }


    pre {

      display: none;

      overflow-x: auto;

      padding: 14px;

      border-radius: 10px;

      background: #0b0d10;

      color: #cbd1da;

      font-size: 11px;

      line-height: 1.4;

      white-space: pre-wrap;

      word-break: break-word;

    }


    @media (max-width: 420px) {

      .squad {
        gap: 6px;
      }


      .character-name {
        font-size: 9px;
      }


      .buttons {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    SWGOH Arena Tracker
  </h1>


  <div class="subtitle">
    Тест получения состава арены
  </div>


  <input
    id="allyCode"
    type="text"
    inputmode="numeric"
    maxlength="9"
    placeholder="Ally Code (9 цифр)"
  >


  <div class="buttons">

    <button onclick="getArena()">
      Получить Arena
    </button>


    <button onclick="getPlayer()">
      Получить профиль
    </button>

  </div>


  <div
    id="status"
    class="status"
  ></div>


  <div
    id="arenaCard"
    class="arena-card"
  >

    <div class="player-header">

      <div>

        <div
          id="playerName"
          class="player-name"
        >
          —
        </div>


        <div
          id="playerLevel"
          class="subtitle"
        >
          —
        </div>

      </div>


      <div>

        <div
          id="rank"
          class="rank"
        >
          —
        </div>


        <div class="rank-label">
          ARENA RANK
        </div>

      </div>

    </div>


    <div class="squad-title">
      Squad Arena
    </div>


    <div
      id="squad"
      class="squad"
    ></div>

  </div>


  <!-- DEBUG -->

  <button
    class="debug-button"
    onclick="toggleDebug()"
  >
    DEBUG ▾
  </button>


  <div
    id="debugPanel"
    class="debug-panel"
  >

    <div class="debug-header">
      SWGOH ARENA TRACKER — DEBUG CONSOLE
    </div>


    <div
      id="debugContent"
      class="debug-content"
    >
      Ожидание...
    </div>

  </div>


  <!-- JSON -->

  <div class="json-section">


    <button
      id="copyButton"
      onclick="copyJSON()"
      style="display:none;"
    >
      📋 Копировать JSON
    </button>


    <pre id="output"></pre>

  </div>


</div>


<script>


const PROXY_URL =
  "https://arena-tracker-proxy.onrender.com";


const CHARACTER_NAMES = {

  GLLEIA:
    "Leia Organa",

  CAPTAINDROGAN:
    "Captain Drogan",

  R2D2_LEGENDARY:
    "R2-D2",

  CAPTAINREX:
    "Captain Rex",

  C3POCHEWBACCA:
    "C-3PO & Chewbacca"

};


let debugLines = [];


/* =====================================================
   DEBUG
===================================================== */

function clearDebug() {

  debugLines = [];

  renderDebug();

}


function addDebug(
  text,
  type = ""
) {

  debugLines.push({
    text,
    type
  });


  renderDebug();

}


function renderDebug() {

  const container =
    document.getElementById(
      "debugContent"
    );


  if (!debugLines.length) {

    container.textContent =
      "Ожидание...";

    return;

  }


  container.innerHTML = "";


  debugLines.forEach(
    entry => {

      const line =
        document.createElement(
          "div"
        );


      line.className =
        "debug-entry";


      if (
        entry.type
      ) {

        line.classList.add(
          `debug-${entry.type}`
        );

      }


      line.textContent =
        entry.text;


      container.appendChild(
        line
      );

    }
  );


  container.scrollTop =
    container.scrollHeight;

}


function toggleDebug() {

  const panel =
    document.getElementById(
      "debugPanel"
    );


  panel.style.display =
    panel.style.display === "block"
      ? "none"
      : "block";

}


/* =====================================================
   BASIC
===================================================== */

function getBaseUnitId(
  unitDefId
) {

  if (!unitDefId) {
    return "";
  }


  return unitDefId
    .split(":")[0]
    .toUpperCase();

}


function getCharacterName(
  unitDefId
) {

  const id =
    getBaseUnitId(
      unitDefId
    );


  return (
    CHARACTER_NAMES[id] ||
    id
  );

}


/* =====================================================
   IMAGE
===================================================== */

async function getCharacterImage(
  unitDefId
) {

  addDebug(
    `→ Ищем портрет: ${unitDefId}`
  );


  try {

    const response =
      await fetch(
        `${PROXY_URL}/characterImage`,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              unitDefId
            })

        }
      );


    const data =
      await response.json();


    if (
      Array.isArray(
        data.debug
      )
    ) {

      data.debug.forEach(
        line => {

          let type = "";


          if (
            line.includes("✓")
          ) {
            type = "success";
          }


          if (
            line.includes("❌") ||
            line.includes("ERROR")
          ) {
            type = "error";
          }


          addDebug(
            `  ${line}`,
            type
          );

        }
      );

    }


    if (
      data.image?.url
    ) {

      addDebug(
        `✓ IMAGE FOUND`,
        "success"
      );


      addDebug(
        `  file: ${data.image.file}`
      );


      addDebug(
        `  score: ${data.image.score}`
      );


      return data.image.url;

    }


    addDebug(
      `❌ IMAGE NOT FOUND`,
      "error"
    );


    return null;


  } catch (error) {

    addDebug(
      `❌ Request error: ${error.message}`,
      "error"
    );


    return null;

  }

}


/* =====================================================
   API
===================================================== */

async function requestData(
  endpoint,
  allyCode
) {

  addDebug(
    `API → ${endpoint}`
  );


  const response =
    await fetch(
      `${PROXY_URL}${endpoint}`,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            payload: {
              allyCode
            }

          })

      }
    );


  const text =
    await response.text();


  let data;


  try {

    data =
      JSON.parse(text);

  } catch {

    throw new Error(
      "Сервер вернул не JSON"
    );

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      data.message ||
      `HTTP ${response.status}`
    );

  }


  addDebug(
    `API ← ${endpoint} ✓`,
    "success"
  );


  return data;

}


/* =====================================================
   ALLY CODE
===================================================== */

function getAllyCode() {

  const value =
    document
      .getElementById(
        "allyCode"
      )
      .value
      .trim();


  if (
    !/^[1-9]{9}$/.test(
      value
    )
  ) {

    throw new Error(
      "Введите Ally Code из 9 цифр."
    );

  }


  return value;

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text
) {

  document
    .getElementById(
      "status"
    )
    .textContent =
      text;

}


/* =====================================================
   JSON
===================================================== */

function showJSON(
  data
) {

  const output =
    document.getElementById(
      "output"
    );


  output.textContent =
    JSON.stringify(
      data,
      null,
      2
    );


  output.style.display =
    "block";


  document.getElementById(
    "copyButton"
  ).style.display =
    "block";

}


/* =====================================================
   ARENA
===================================================== */

async function getArena() {

  clearDebug();

  try {

    const allyCode =
      getAllyCode();


    addDebug(
      "════════════════════"
    );


    addDebug(
      "START ARENA REQUEST"
    );


    addDebug(
      `Ally Code: ${allyCode}`
    );


    setStatus(
      "Получаем данные Arena..."
    );


    const data =
      await requestData(
        "/playerArena",
        allyCode
      );


    showJSON(data);


    await renderArena(data);


    setStatus(
      "Готово."
    );


    addDebug(
      "════════════════════"
    );


    addDebug(
      "DONE ✓",
      "success"
    );


  } catch (error) {

    console.error(error);


    addDebug(
      `❌ ERROR: ${error.message}`,
      "error"
    );


    setStatus(
      "Ошибка: " +
      error.message
    );

  }

}


/* =====================================================
   PLAYER
===================================================== */

async function getPlayer() {

  clearDebug();


  try {

    const allyCode =
      getAllyCode();


    setStatus(
      "Получаем полный профиль..."
    );


    const data =
      await requestData(
        "/player",
        allyCode
      );


    showJSON(data);


    setStatus(
      "Профиль получен."
    );


  } catch (error) {

    console.error(error);


    addDebug(
      `❌ ERROR: ${error.message}`,
      "error"
    );


    setStatus(
      "Ошибка: " +
      error.message
    );

  }

}


/* =====================================================
   RENDER ARENA
===================================================== */

async function renderArena(
  data
) {

  const profile =
    data.pvpProfile?.[0];


  if (!profile) {

    throw new Error(
      "В ответе нет Squad Arena."
    );

  }


  document
    .getElementById(
      "arenaCard"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "playerName"
    )
    .textContent =
      data.name ||
      "Unknown";


  document
    .getElementById(
      "playerLevel"
    )
    .textContent =
      `Level ${data.level ?? "?"}`;


  document
    .getElementById(
      "rank"
    )
    .textContent =
      "#" +
      (
        profile.rank ??
        "?"
      );


  const squad =
    document.getElementById(
      "squad"
    );


  squad.innerHTML = "";


  const cells =
    profile.squad?.cell ||
    [];


  cells.sort(
    (a, b) =>
      (a.cellIndex ?? 0) -
      (b.cellIndex ?? 0)
  );


  addDebug(
    `Найдено юнитов: ${cells.length}`
  );


  for (
    const cell
    of cells
  ) {

    const unitId =
      cell.unitDefId;


    const character =
      document.createElement(
        "div"
      );


    character.className =
      "character";


    const image =
      document.createElement(
        "img"
      );


    image.className =
      "portrait loading";


    image.alt =
      getCharacterName(
        unitId
      );


    const name =
      document.createElement(
        "div"
      );


    name.className =
      "character-name";


    name.textContent =
      getCharacterName(
        unitId
      );


    character.appendChild(
      image
    );


    character.appendChild(
      name
    );


    squad.appendChild(
      character
    );


    const imageUrl =
      await getCharacterImage(
        unitId
      );


    image.classList.remove(
      "loading"
    );


    if (imageUrl) {

      image.src =
        imageUrl;


      image.onload =
        () => {

          addDebug(
            `✓ Браузер загрузил ${getCharacterName(unitId)}`,
            "success"
          );

        };


      image.onerror =
        () => {

          image.classList.add(
            "error"
          );


          addDebug(
            `❌ Браузер НЕ смог загрузить ${imageUrl}`,
            "error"
          );

        };

    } else {

      image.classList.add(
        "error"
      );

    }

  }

}


/* =====================================================
   COPY
===================================================== */

async function copyJSON() {

  const text =
    document
      .getElementById(
        "output"
      )
      .textContent;


  try {

    await navigator
      .clipboard
      .writeText(text);


    setStatus(
      "JSON скопирован."
    );


  } catch {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    setStatus(
      "JSON скопирован."
    );

  }

}

</script>


</body>

</html>
