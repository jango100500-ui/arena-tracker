<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SWGOH API Test</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      max-width: 300px;
      box-sizing: border-box;

      padding: 12px;

      font-size: 18px;

      margin-bottom: 10px;
    }

    button {
      padding: 12px 18px;

      margin-right: 8px;
      margin-bottom: 10px;

      font-size: 16px;

      cursor: pointer;
    }

    #copyButton {
      display: none;
      margin-top: 5px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    #result {

      margin-top: 15px;

      padding: 15px;

      background: #111;

      color: #eee;

      border-radius: 8px;

      overflow-x: auto;

      white-space: pre-wrap;

      word-break: break-word;
    }

  </style>

</head>

<body>

  <h1>
    SWGOH API Test
  </h1>

  <input
    id="allyCode"
    type="text"
    inputmode="numeric"
    maxlength="9"
    placeholder="Ally Code"
  >

  <br>

  <button onclick="getArena()">
    Получить Arena
  </button>

  <button onclick="getPlayer()">
    Получить полный профиль
  </button>

  <p id="status"></p>

  <button
    id="copyButton"
    onclick="copyJSON()"
  >
    📋 Копировать JSON
  </button>

  <pre id="result"></pre>


  <script>

    const PROXY =
      "https://arena-tracker-proxy.onrender.com";


    function getAllyCode() {

      const allyCode =
        document
          .getElementById("allyCode")
          .value
          .trim();

      if (!/^[1-9]{9}$/.test(allyCode)) {

        document
          .getElementById("status")
          .textContent =
            "Введите 9 цифр Ally Code без дефисов.";

        return null;
      }

      return allyCode;
    }


    async function requestData(
      endpoint,
      allyCode
    ) {

      const status =
        document
          .getElementById("status");

      const result =
        document
          .getElementById("result");

      const copyButton =
        document
          .getElementById("copyButton");


      result.textContent = "";

      copyButton.style.display = "none";


      status.textContent =
        "Запрашиваю данные...";


      try {

        const response =
          await fetch(
            `${PROXY}${endpoint}`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                payload: {
                  allyCode: allyCode
                }
              })
            }
          );


        const text =
          await response.text();


        status.textContent =
          "HTTP " + response.status;


        try {

          const json =
            JSON.parse(text);

          result.textContent =
            JSON.stringify(
              json,
              null,
              2
            );

        } catch {

          result.textContent =
            text;
        }


        if (text) {
          copyButton.style.display =
            "inline-block";
        }


      } catch (error) {

        status.textContent =
          "Ошибка запроса";

        result.textContent =
          error.toString();

        console.error(error);
      }
    }


    async function copyJSON() {

      const result =
        document
          .getElementById("result");

      const status =
        document
          .getElementById("status");


      if (!result.textContent) {
        return;
      }


      try {

        await navigator.clipboard.writeText(
          result.textContent
        );

        status.textContent =
          "JSON скопирован ✓";


      } catch (error) {

        // Запасной вариант
        const textarea =
          document.createElement("textarea");

        textarea.value =
          result.textContent;

        document.body.appendChild(
          textarea
        );

        textarea.select();

        document.execCommand(
          "copy"
        );

        textarea.remove();


        status.textContent =
          "JSON скопирован ✓";
      }
    }


    async function getArena() {

      const allyCode =
        getAllyCode();

      if (!allyCode) {
        return;
      }

      await requestData(
        "/playerArena",
        allyCode
      );
    }


    async function getPlayer() {

      const allyCode =
        getAllyCode();

      if (!allyCode) {
        return;
      }

      await requestData(
        "/player",
        allyCode
      );
    }

  </script>

</body>

</html>
