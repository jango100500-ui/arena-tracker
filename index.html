<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>SWGOH Arena Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0d1015;
      color: #f2f4f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      padding: 20px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* -------------------------------------------------- */
    /* HEADER */
    /* -------------------------------------------------- */

    .header {
      margin-bottom: 20px;
    }

    .title {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 5px;
      color: #8f98a8;
      font-size: 14px;
    }

    /* -------------------------------------------------- */
    /* INPUT */
    /* -------------------------------------------------- */

    .search-card {
      background: #151a22;
      border: 1px solid #242b36;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .ally-input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 14px;

      border: 1px solid #303846;
      border-radius: 12px;

      background: #0d1117;
      color: #ffffff;

      outline: none;
    }

    .ally-input:focus {
      border-color: #596579;
    }

    .button {
      height: 48px;
      padding: 0 18px;

      border: 0;
      border-radius: 12px;

      background: #e7ebf0;
      color: #11151b;

      font-weight: 700;
      white-space: nowrap;
    }

    .button:active {
      transform: scale(0.98);
    }

    .button.secondary {
      background: #242b36;
      color: #e6eaf0;
    }

    .button.small {
      height: 40px;
      padding: 0 13px;
      font-size: 13px;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    /* -------------------------------------------------- */
    /* STATUS */
    /* -------------------------------------------------- */

    .status {
      display: none;
      margin-bottom: 16px;

      padding: 12px 14px;
      border-radius: 12px;

      background: #151a22;
      border: 1px solid #242b36;

      color: #aeb6c4;
      font-size: 14px;
      line-height: 1.45;
    }

    .status.visible {
      display: block;
    }

    .status.error {
      border-color: #713b42;
      color: #ffb4bc;
      background: #211316;
    }

    .status.success {
      border-color: #385f47;
      color: #b7e5c4;
      background: #111b15;
    }

    /* -------------------------------------------------- */
    /* PLAYER CARD */
    /* -------------------------------------------------- */

    .player-card {
      display: none;

      background: #151a22;
      border: 1px solid #242b36;
      border-radius: 16px;

      padding: 18px;
      margin-bottom: 16px;
    }

    .player-card.visible {
      display: block;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .player-name {
      font-size: 23px;
      font-weight: 800;
      margin: 0;
    }

    .player-meta {
      margin-top: 5px;
      color: #8f98a8;
      font-size: 13px;
      line-height: 1.5;
    }

    .ratings {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .rating {
      min-width: 150px;
      padding: 12px;

      border-radius: 12px;
      background: #0e131a;
      border: 1px solid #242b36;
    }

    .rating-label {
      color: #818b9b;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .rating-value {
      font-size: 22px;
      font-weight: 800;
    }

    /* -------------------------------------------------- */
    /* SECTION */
    /* -------------------------------------------------- */

    .section {
      display: none;

      background: #151a22;
      border: 1px solid #242b36;
      border-radius: 16px;

      padding: 16px;
      margin-bottom: 16px;
    }

    .section.visible {
      display: block;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .section-subtitle {
      color: #818b9b;
      font-size: 12px;
      margin-top: 3px;
    }

    /* -------------------------------------------------- */
    /* ARENA TABLE */
    /* -------------------------------------------------- */

    .arena-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .arena-row {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) auto;

      align-items: center;
      gap: 10px;

      min-height: 58px;
      padding: 7px 10px;

      background: #0e131a;
      border: 1px solid #242b36;
      border-radius: 12px;
    }

    .arena-row.me {
      background: #1b2029;
      border-color: #697384;
    }

    .arena-rank {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #b8c0cc;
    }

    .arena-player {
      min-width: 0;
    }

    .arena-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 15px;
      font-weight: 700;
    }

    .arena-ally {
      margin-top: 2px;
      color: #727c8d;
      font-size: 11px;
    }

    .arena-score {
      text-align: right;
      color: #9ca6b5;
      font-size: 12px;
    }

    /* -------------------------------------------------- */
    /* SQUAD */
    /* -------------------------------------------------- */

    .squad {
      display: grid;
      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 10px;
    }

    .unit-card {
      min-width: 0;
      overflow: hidden;

      background: #0e131a;
      border: 1px solid #242b36;
      border-radius: 13px;

      padding: 8px;
    }

    .unit-image-wrap {
      position: relative;

      width: 100%;
      aspect-ratio: 1 / 1;

      overflow: hidden;
      border-radius: 10px;

      background: #080b10;
    }

    .unit-image {
      width: 100%;
      height: 100%;
      display: block;

      object-fit: cover;
    }

    .unit-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #596271;
      font-size: 22px;
    }

    .unit-name {
      margin-top: 7px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 11px;
      font-weight: 700;
      color: #c4cbd5;
    }

    .unit-id {
      margin-top: 2px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: #626c7c;
      font-size: 9px;
    }

    /* -------------------------------------------------- */
    /* DATACRON */
    /* -------------------------------------------------- */

    .datacron {
      padding: 14px;

      background: #0e131a;
      border: 1px solid #242b36;
      border-radius: 12px;
    }

    .datacron-id {
      font-size: 14px;
      font-weight: 700;
      word-break: break-all;
    }

    .datacron-meta {
      margin-top: 5px;
      color: #818b9b;
      font-size: 12px;
    }

    .affixes {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 12px;
    }

    .affix {
      padding: 9px 10px;
      border-radius: 9px;
      background: #151b24;
      color: #abb3c0;
      font-size: 12px;
      line-height: 1.4;
    }

    /* -------------------------------------------------- */
    /* DEBUG */
    /* -------------------------------------------------- */

    .debug {
      display: none;

      background: #090c11;
      border: 1px solid #242b36;
      border-radius: 16px;

      padding: 14px;
      margin-bottom: 16px;
    }

    .debug.visible {
      display: block;
    }

    .debug-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .debug-console {
      margin: 0;

      max-height: 330px;
      overflow: auto;

      padding: 12px;

      border-radius: 10px;
      background: #05070a;

      color: #8f9aaa;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 11px;
      line-height: 1.5;

      white-space: pre-wrap;
      word-break: break-word;
    }

    /* -------------------------------------------------- */
    /* EMPTY */
    /* -------------------------------------------------- */

    .empty {
      padding: 30px 15px;

      text-align: center;

      color: #687384;
      font-size: 13px;
    }

    /* -------------------------------------------------- */
    /* MOBILE */
    /* -------------------------------------------------- */

    @media (max-width: 650px) {
      body {
        padding: 12px;
      }

      .title {
        font-size: 24px;
      }

      .input-row {
        flex-direction: column;
      }

      .input-row .button {
        width: 100%;
      }

      .player-top {
        flex-direction: column;
      }

      .rating {
        min-width: 0;
        flex: 1;
      }

      .squad {
        gap: 6px;
      }

      .unit-card {
        padding: 5px;
        border-radius: 10px;
      }

      .unit-name {
        font-size: 9px;
      }

      .unit-id {
        font-size: 8px;
      }

      .arena-row {
        grid-template-columns: 42px minmax(0, 1fr) auto;
        padding: 6px 7px;
      }

      .arena-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">
    <h1 class="title">SWGOH Arena Tracker</h1>

    <div class="subtitle">
      Squad Arena · Fleet Arena · Squad · Datacron
    </div>
  </div>


  <!-- SEARCH -->

  <div class="search-card">

    <div class="input-row">

      <input
        id="allyCode"
        class="ally-input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Введите Ally Code"
      >

      <button
        id="arenaButton"
        class="button"
        onclick="loadArena()"
      >
        Получить Arena
      </button>

    </div>

    <div class="actions">

      <button
        class="button secondary small"
        onclick="loadPlayer()"
      >
        Получить профиль
      </button>

      <button
        class="button secondary small"
        onclick="testPortraits()"
      >
        Test portraits
      </button>

      <button
        class="button secondary small"
        onclick="testGameData()"
      >
        Test game data
      </button>

      <button
        class="button secondary small"
        onclick="toggleDebug()"
      >
        Debug
      </button>

    </div>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  ></div>


  <!-- PLAYER -->

  <div
    id="playerCard"
    class="player-card"
  >

    <div class="player-top">

      <div>

        <h2
          id="playerName"
          class="player-name"
        >
          —
        </h2>

        <div
          id="playerMeta"
          class="player-meta"
        >
          —
        </div>

      </div>

    </div>


    <div class="ratings">

      <div class="rating">

        <div class="rating-label">
          Squad Arena
        </div>

        <div
          id="squadRank"
          class="rating-value"
        >
          —
        </div>

      </div>


      <div class="rating">

        <div class="rating-label">
          Fleet Arena
        </div>

        <div
          id="fleetRank"
          class="rating-value"
        >
          —
        </div>

      </div>


      <div class="rating">

        <div class="rating-label">
          Skill Rating
        </div>

        <div
          id="skillRating"
          class="rating-value"
        >
          —
        </div>

      </div>

    </div>

  </div>


  <!-- ARENA -->

  <div
    id="arenaSection"
    class="section"
  >

    <div class="section-header">

      <div>

        <h2 class="section-title">
          Squad Arena
        </h2>

        <div class="section-subtitle">
          Текущий топ игроков
        </div>

      </div>

    </div>


    <div
      id="arenaList"
      class="arena-list"
    ></div>

  </div>


  <!-- SQUAD -->

  <div
    id="squadSection"
    class="section"
  >

    <div class="section-header">

      <div>

        <h2 class="section-title">
          Squad
        </h2>

        <div class="section-subtitle">
          Защищающаяся команда
        </div>

      </div>

    </div>


    <div
      id="squad"
      class="squad"
    ></div>

  </div>


  <!-- DATACRON -->

  <div
    id="datacronSection"
    class="section"
  >

    <div class="section-header">

      <div>

        <h2 class="section-title">
          Datacron
        </h2>

        <div class="section-subtitle">
          Активный Datacron
        </div>

      </div>

    </div>


    <div
      id="datacron"
      class="datacron"
    ></div>

  </div>


  <!-- DEBUG -->

  <div
    id="debug"
    class="debug"
  >

    <div class="debug-title">
      Debug Console
    </div>

    <pre
      id="debugConsole"
      class="debug-console"
    ></pre>

  </div>

</div>


<script>

  // ==========================================================
  // CONFIG
  // ==========================================================

  const API_BASE = "";


  // ==========================================================
  // ELEMENTS
  // ==========================================================

  const allyCodeInput =
    document.getElementById("allyCode");

  const statusElement =
    document.getElementById("status");

  const debugElement =
    document.getElementById("debug");

  const debugConsole =
    document.getElementById("debugConsole");


  // ==========================================================
  // DEBUG
  // ==========================================================

  function debug(...args) {

    const line =
      args
        .map(value => {

          if (
            typeof value === "string"
          ) {
            return value;
          }

          try {
            return JSON.stringify(
              value,
              null,
              2
            );
          } catch {
            return String(value);
          }

        })
        .join(" ");

    console.log(...args);

    debugConsole.textContent +=
      line + "\n";

    debugConsole.scrollTop =
      debugConsole.scrollHeight;
  }


  function clearDebug() {
    debugConsole.textContent = "";
  }


  function toggleDebug() {
    debugElement.classList.toggle(
      "visible"
    );
  }


  // ==========================================================
  // STATUS
  // ==========================================================

  function setStatus(
    message,
    type = ""
  ) {

    statusElement.textContent =
      message;

    statusElement.className =
      "status visible " + type;
  }


  function clearStatus() {

    statusElement.textContent = "";

    statusElement.className =
      "status";
  }


  // ==========================================================
  // POST
  // ==========================================================

  async function post(
    path,
    body
  ) {

    debug(
      "POST",
      path,
      body
    );

    const response =
      await fetch(
        API_BASE + path,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );

    const text =
      await response.text();

    let data;

    try {
      data =
        JSON.parse(text);
    } catch {
      data = text;
    }

    debug(
      "RESPONSE",
      response.status,
      data
    );

    if (!response.ok) {

      let message;

      if (
        data &&
        typeof data === "object"
      ) {
        message =
          data.error ||
          JSON.stringify(data);
      } else {
        message =
          String(data);
      }

      throw new Error(
        `${response.status}: ${message}`
      );
    }

    return data;
  }


  // ==========================================================
  // ALLY CODE
  // ==========================================================

  function getAllyCode() {

    const value =
      allyCodeInput.value
        .trim()
        .replace(/\s+/g, "");

    if (!value) {

      throw new Error(
        "Введите Ally Code"
      );
    }

    if (!/^\d+$/.test(value)) {

      throw new Error(
        "Ally Code должен содержать только цифры"
      );
    }

    return value;
  }


  // ==========================================================
  // LOAD ARENA
  // ==========================================================

  async function loadArena() {

    clearDebug();

    try {

      const allyCode =
        getAllyCode();

      setStatus(
        "Получаю данные Arena…"
      );

      document
        .getElementById("arenaButton")
        .disabled = true;


      // ВАЖНО:
      // Здесь отправляем allyCode.
      // Proxy сам превращает его в:
      //
      // {
      //   payload: {
      //     allyCode: "...",
      //     playerDetailsOnly: false
      //   }
      // }

      const data =
        await post(
          "/playerArena",
          {
            allyCode
          }
        );


      debug(
        "ARENA DATA",
        data
      );


      renderArena(data);

      renderPlayerFromArena(data);

      renderSquadFromArena(data);

      renderDatacronFromArena(data);


      setStatus(
        "Arena успешно загружена",
        "success"
      );

    } catch (error) {

      console.error(error);

      debug(
        "ERROR",
        error.message
      );

      setStatus(
        "Ошибка: " +
        error.message,
        "error"
      );

    } finally {

      document
        .getElementById("arenaButton")
        .disabled = false;
    }
  }


  // ==========================================================
  // LOAD PLAYER
  // ==========================================================

  async function loadPlayer() {

    clearDebug();

    try {

      const allyCode =
        getAllyCode();

      setStatus(
        "Получаю профиль…"
      );


      const data =
        await post(
          "/player",
          {
            allyCode
          }
        );


      debug(
        "PLAYER DATA",
        data
      );


      renderPlayer(
        data
      );


      setStatus(
        "Профиль успешно загружен",
        "success"
      );

    } catch (error) {

      console.error(error);

      debug(
        "ERROR",
        error.message
      );

      setStatus(
        "Ошибка: " +
        error.message,
        "error"
      );
    }
  }


  // ==========================================================
  // PLAYER FROM ARENA
  // ==========================================================

  function renderPlayerFromArena(
    data
  ) {

    const player =
      data?.player ||
      data?.playerData ||
      data;


    renderPlayer(
      player,
      data
    );
  }


  // ==========================================================
  // PLAYER RENDER
  // ==========================================================

  function renderPlayer(
    data,
    arenaData = null
  ) {

    if (!data) {
      return;
    }


    const playerCard =
      document.getElementById(
        "playerCard"
      );

    playerCard.classList.add(
      "visible"
    );


    const name =
      data.name ||
      data.playerName ||
      data.displayName ||
      "Unknown player";


    const level =
      data.level ??
      data.playerLevel ??
      "—";


    const allyCode =
      data.allyCode ??
      data.allycode ??
      "—";


    document.getElementById(
      "playerName"
    ).textContent =
      name;


    document.getElementById(
      "playerMeta"
    ).textContent =
      `Level ${level} · Ally Code ${allyCode}`;


    let squadRank =
      "—";

    let fleetRank =
      "—";


    const profiles =
      arenaData?.pvpProfile ||
      data?.pvpProfile ||
      [];


    if (Array.isArray(profiles)) {

      if (profiles[0]) {
        squadRank =
          profiles[0].rank ??
          "—";
      }

      if (profiles[1]) {
        fleetRank =
          profiles[1].rank ??
          "—";
      }
    }


    document.getElementById(
      "squadRank"
    ).textContent =
      squadRank;


    document.getElementById(
      "fleetRank"
    ).textContent =
      fleetRank;


    const skillRating =
      data?.playerRating
        ?.playerSkillRating
        ?.skillRating ??
      arenaData?.playerRating
        ?.playerSkillRating
        ?.skillRating ??
      "—";


    document.getElementById(
      "skillRating"
    ).textContent =
      skillRating;
  }


  // ==========================================================
  // FIND ARENA CELLS
  // ==========================================================

  function findArenaCells(
    data
  ) {

    const cells =
      data?.pvpProfile?.[0]
        ?.squad?.cell;

    if (
      Array.isArray(cells)
    ) {
      return [...cells]
        .sort(
          (a, b) =>
            Number(
              a.cellIndex ?? 0
            ) -
            Number(
              b.cellIndex ?? 0
            )
        );
    }

    return [];
  }


  // ==========================================================
  // ARENA RENDER
  // ==========================================================

  function renderArena(
    data
  ) {

    const section =
      document.getElementById(
        "arenaSection"
      );

    const list =
      document.getElementById(
        "arenaList"
      );


    section.classList.add(
      "visible"
    );


    list.innerHTML = "";


    /*
      Comlink may return different
      structures depending on version.

      Try several common locations.
    */

    let players =
      data?.pvpProfile?.[0]
        ?.rankings ||
      data?.pvpProfile?.[0]
        ?.player ||
      data?.arena ||
      data?.players ||
      [];


    if (
      !Array.isArray(players)
    ) {

      /*
        If the current player arena
        response contains only the
        current player's profile,
        display that player instead.
      */

      const name =
        data?.name ||
        data?.playerName;

      const rank =
        data?.pvpProfile?.[0]?.rank;

      if (
        name ||
        rank
      ) {

        players = [
          {
            name,
            rank,
            allyCode:
              data?.allyCode
          }
        ];

      } else {

        list.innerHTML =
          `
          <div class="empty">
            Arena data received,
            but ranking list was not
            included in the response.
          </div>
          `;

        return;
      }
    }


    if (!players.length) {

      list.innerHTML =
        `
        <div class="empty">
          No arena players found.
        </div>
        `;

      return;
    }


    const ownAllyCode =
      String(
        data?.allyCode ??
        data?.player?.allyCode ??
        ""
      );


    for (
      const player of players
    ) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "arena-row";


      const rank =
        player.rank ??
        player.currentRank ??
        player.position ??
        "—";


      const name =
        player.name ??
        player.playerName ??
        player.displayName ??
        "Unknown";


      const allyCode =
        player.allyCode ??
        player.allycode ??
        "";


      if (
        ownAllyCode &&
        String(allyCode) ===
          ownAllyCode
      ) {
        row.classList.add(
          "me"
        );
      }


      row.innerHTML =
        `
        <div class="arena-rank">
          ${escapeHtml(rank)}
        </div>

        <div class="arena-player">

          <div class="arena-name">
            ${escapeHtml(name)}
          </div>

          ${
            allyCode
              ? `
                <div class="arena-ally">
                  Ally Code ${escapeHtml(allyCode)}
                </div>
              `
              : ""
          }

        </div>

        <div class="arena-score">
          ${player.skillRating ??
            player.rating ??
            ""}
        </div>
        `;


      list.appendChild(
        row
      );
    }
  }


  // ==========================================================
  // SQUAD
  // ==========================================================

  function renderSquadFromArena(
    data
  ) {

    const cells =
      findArenaCells(data);


    const section =
      document.getElementById(
        "squadSection"
      );

    const squad =
      document.getElementById(
        "squad"
      );


    section.classList.add(
      "visible"
    );


    squad.innerHTML = "";


    if (!cells.length) {

      squad.innerHTML =
        `
        <div class="empty">
          Squad не найдена в ответе Comlink.
        </div>
        `;

      return;
    }


    for (
      const cell of cells
    ) {

      const unitDefId =
        cell.unitDefId ||
        cell.unit?.unitDefId ||
        cell.definitionId ||
        "";


      addUnitCard(
        squad,
        unitDefId
      );
    }
  }


  // ==========================================================
  // UNIT CARD
  // ==========================================================

  function addUnitCard(
    container,
    unitDefId
  ) {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "unit-card";


    const imageWrap =
      document.createElement(
        "div"
      );

    imageWrap.className =
      "unit-image-wrap";


    const placeholder =
      document.createElement(
        "div"
      );

    placeholder.className =
      "unit-placeholder";

    placeholder.textContent =
      "…";


    imageWrap.appendChild(
      placeholder
    );


    const name =
      document.createElement(
        "div"
      );

    name.className =
      "unit-name";

    name.textContent =
      prettyUnitName(
        unitDefId
      );


    const id =
      document.createElement(
        "div"
      );

    id.className =
      "unit-id";

    id.textContent =
      unitDefId;


    card.appendChild(
      imageWrap
    );

    card.appendChild(
      name
    );

    card.appendChild(
      id
    );


    container.appendChild(
      card
    );


    if (!unitDefId) {
      placeholder.textContent =
        "?";
      return;
    }


    getCharacterImage(
      unitDefId
    )
      .then(result => {

        if (
          result?.ok &&
          result.url
        ) {

          const img =
            document.createElement(
              "img"
            );

          img.className =
            "unit-image";

          img.alt =
            prettyUnitName(
              unitDefId
            );

          img.src =
            result.url;


          img.onerror = () => {

            imageWrap.innerHTML =
              `
              <div class="unit-placeholder">
                ?
              </div>
              `;
          };


          imageWrap.innerHTML = "";

          imageWrap.appendChild(
            img
          );

        } else {

          placeholder.textContent =
            "?";
        }

      })
      .catch(error => {

        debug(
          "Portrait error",
          unitDefId,
          error.message
        );

        placeholder.textContent =
          "?";
      });
  }


  // ==========================================================
  // CHARACTER IMAGE
  // ==========================================================

  async function getCharacterImage(
    unitDefId
  ) {

    const result =
      await post(
        "/characterImage",
        {
          unitDefId
        }
      );

    return result;
  }


  // ==========================================================
  // DATACRON
  // ==========================================================

  function renderDatacronFromArena(
    data
  ) {

    const datacron =
      data?.pvpProfile?.[0]
        ?.squad?.datacron ||
      data?.pvpProfile?.[0]
        ?.datacron ||
      data?.datacron;


    const section =
      document.getElementById(
        "datacronSection"
      );

    const container =
      document.getElementById(
        "datacron"
      );


    if (!datacron) {

      section.classList.remove(
        "visible"
      );

      container.innerHTML = "";

      return;
    }


    section.classList.add(
      "visible"
    );


    const id =
      datacron.id ??
      "—";


    const setId =
      datacron.setId ??
      "—";


    const tier =
      datacron.highestTierApplied ??
      "—";


    let affixes =
      datacron.affixes ||
      [];


    if (
      !Array.isArray(affixes)
    ) {
      affixes = [];
    }


    let affixHtml = "";


    if (affixes.length) {

      affixHtml =
        `
        <div class="affixes">

          ${
            affixes
              .map(
                affix =>
                  `
                  <div class="affix">
                    ${escapeHtml(
                      typeof affix === "string"
                        ? affix
                        : JSON.stringify(
                            affix
                          )
                    )}
                  </div>
                  `
              )
              .join("")
          }

        </div>
        `;
    }


    container.innerHTML =
      `
      <div class="datacron-id">
        ${escapeHtml(id)}
      </div>

      <div class="datacron-meta">
        Set: ${escapeHtml(setId)}
        · Tier: ${escapeHtml(tier)}
      </div>

      ${affixHtml}
      `;
  }


  // ==========================================================

      setStatus(

        await fetch(
          "/portraitStatus"
        );


      const data =
        await response.json();


      debug(

          `HTTP ${response.status}`
        );

      );

  // ==========================================================
  // PRETTY UNIT NAME
  // ==========================================================

  function prettyUnitName(
    unitDefId
  ) {

    if (!unitDefId) {
      return "Unknown";
    }


    const base =
      String(unitDefId)
        .split(":")[0];


    const names = {

      GLLEIA:
        "GL Leia",

      CAPTAINDROGAN:
        "Captain Drogan",

      R2D2_LEGENDARY:
        "R2-D2",

      CAPTAINREX:
        "Captain Rex",

      C3POCHEWBACCA:
        "Threepio & Chewie",

      JABBATHEHUTT:
        "Jabba",

      LORDVADER:
        "Lord Vader",

      DARTHVADER:
        "Darth Vader",

      REY:
        "Rey",

      SUPREMELEADERKYLOREN:
        "Supreme Leader Kylo Ren",

      KYLOREN:
        "Kylo Ren",

      LUKEHERMITLEGENDARY:
        "Jedi Master Luke",

      PALPATINE:
        "Emperor Palpatine",

      GRANDMASTERYODA:
        "Grand Master Yoda"
    };


    if (names[base]) {
      return names[base];
    }


    return base
      .replace(/_/g, " ")
      .replace(
        /\b\w/g,
        letter =>
          letter.toUpperCase()
      );
  }


  // ==========================================================
  // ESCAPE HTML
  // ==========================================================

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  // ==========================================================
  // ENTER KEY
  // ==========================================================

  allyCodeInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {
        loadArena();
      }

    }
  );


  // ==========================================================
  // INITIAL
  // ==========================================================

  debug(
    "Arena Tracker initialized"
  );

</script>
