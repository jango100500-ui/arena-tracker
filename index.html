<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>SWGOH Arena Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0d1015;
      color: #f2f4f7;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      padding: 18px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      margin-bottom: 18px;
    }

    .title {
      margin: 0;

      font-size: 27px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 5px;

      color: #858e9d;
      font-size: 13px;
    }

    /* SEARCH */

    .search-card {
      padding: 14px;

      background: #151a22;
      border: 1px solid #242b36;
      border-radius: 15px;

      margin-bottom: 14px;
    }

    .input-row {
      display: flex;
      gap: 9px;
    }

    .ally-input {
      flex: 1;
      min-width: 0;

      height: 47px;
      padding: 0 14px;

      border: 1px solid #303846;
      border-radius: 11px;

      background: #0d1117;
      color: #fff;

      outline: none;
      font-size: 15px;
    }

    .ally-input:focus {
      border-color: #596579;
    }

    .button {
      height: 47px;
      padding: 0 18px;

      border: 0;
      border-radius: 11px;

      background: #e8ecf1;
      color: #11151b;

      font-weight: 750;
      white-space: nowrap;
    }

    .button:active {
      transform: scale(.98);
    }

    .button:disabled {
      opacity: .55;
      cursor: default;
    }

    /* STATUS */

    .status {
      display: none;

      padding: 11px 13px;
      margin-bottom: 14px;

      border-radius: 11px;

      background: #151a22;
      border: 1px solid #242b36;

      color: #aeb6c4;
      font-size: 13px;
      line-height: 1.45;
    }

    .status.visible {
      display: block;
    }

    .status.error {
      background: #211417;
      border-color: #6e3941;
      color: #ffb7be;
    }

    .status.success {
      background: #111b15;
      border-color: #385d46;
      color: #b9e6c6;
    }

    /* CARD */

    .section {
      display: none;

      padding: 15px;
      margin-bottom: 14px;

      background: #151a22;
      border: 1px solid #242b36;
      border-radius: 15px;
    }

    .section.visible {
      display: block;
    }

    .section-title {
      margin: 0;

      font-size: 17px;
      font-weight: 800;
    }

    .section-subtitle {
      margin-top: 3px;

      color: #7e8796;
      font-size: 11px;
    }

    /* PLAYER */

    .player-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
    }

    .player-name {
      margin: 0;

      font-size: 23px;
      line-height: 1.2;
      font-weight: 800;
    }

    .player-meta {
      margin-top: 6px;

      color: #8b95a5;
      font-size: 12px;
      line-height: 1.5;
    }

    .ratings {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 9px;

      margin-top: 15px;
    }

    .rating {
      padding: 11px;

      background: #0e131a;
      border: 1px solid #242b36;
      border-radius: 11px;
    }

    .rating-label {
      color: #788292;
      font-size: 11px;
    }

    .rating-value {
      margin-top: 3px;

      font-size: 21px;
      font-weight: 800;
    }

    /* SQUAD */

    .squad {
      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 9px;

      margin-top: 13px;
    }

    .unit-card {
      min-width: 0;
      overflow: hidden;

      padding: 6px;

      background: #0e131a;
      border: 1px solid #242b36;
      border-radius: 11px;
    }

    .unit-image-wrap {
      position: relative;

      width: 100%;
      aspect-ratio: 1;

      overflow: hidden;

      border-radius: 8px;

      background: #080b10;
    }

    .unit-image {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .unit-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #555f6f;
      font-size: 20px;
    }

    .unit-name {
      margin-top: 6px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: #c3cad4;
      font-size: 10px;
      font-weight: 700;
    }

    /* DATACRON */

    .datacron-box {
      margin-top: 13px;
      padding: 12px;

      background: #0e131a;
      border: 1px solid #242b36;
      border-radius: 11px;
    }

    .datacron-id {
      font-size: 13px;
      font-weight: 700;
      word-break: break-all;
    }

    .datacron-meta {
      margin-top: 4px;

      color: #7f8998;
      font-size: 11px;
    }

    .affixes {
      display: flex;
      flex-direction: column;
      gap: 6px;

      margin-top: 10px;
    }

    .affix {
      padding: 8px 9px;

      border-radius: 8px;

      background: #151b24;

      color: #aab3c0;
      font-size: 11px;
      line-height: 1.4;
    }

    /* ERROR */

    .empty {
      padding: 24px 10px;

      text-align: center;

      color: #687383;
      font-size: 12px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .input-row {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

      .ratings {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

      .rating {
        padding: 9px 7px;
      }

      .rating-label {
        font-size: 9px;
      }

      .rating-value {
        font-size: 18px;
      }

      .squad {
        gap: 5px;
      }

      .unit-card {
        padding: 4px;
      }

      .unit-name {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <h1 class="title">
      SWGOH Arena Tracker
    </h1>

    <div class="subtitle">
      Squad Arena · Squad · Datacron
    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-card">

    <div class="input-row">

      <input
        id="allyCode"
        class="ally-input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Введите Ally Code"
      >

      <button
        id="arenaButton"
        class="button"
        onclick="loadArena()"
      >
        Получить Arena
      </button>

    </div>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  ></div>


  <!-- PLAYER -->

  <div
    id="playerSection"
    class="section"
  >

    <div class="player-head">

      <div>

        <h2
          id="playerName"
          class="player-name"
        >
          —
        </h2>

        <div
          id="playerMeta"
          class="player-meta"
        >
          —
        </div>

      </div>

    </div>


    <div class="ratings">

      <div class="rating">

        <div class="rating-label">
          Squad Arena
        </div>

        <div
          id="squadRank"
          class="rating-value"
        >
          —
        </div>

      </div>


      <div class="rating">

        <div class="rating-label">
          Fleet Arena
        </div>

        <div
          id="fleetRank"
          class="rating-value"
        >
          —
        </div>

      </div>


      <div class="rating">

        <div class="rating-label">
          Skill Rating
        </div>

        <div
          id="skillRating"
          class="rating-value"
        >
          —
        </div>

      </div>

    </div>

  </div>


  <!-- SQUAD -->

  <div
    id="squadSection"
    class="section"
  >

    <h2 class="section-title">
      Squad
    </h2>

    <div class="section-subtitle">
      Текущая команда
    </div>

    <div
      id="squad"
      class="squad"
    ></div>

  </div>


  <!-- DATACRON -->

  <div
    id="datacronSection"
    class="section"
  >

    <h2 class="section-title">
      Datacron
    </h2>

    <div class="section-subtitle">
      Активный Datacron
    </div>

    <div
      id="datacron"
      class="datacron-box"
    ></div>

  </div>

</div>


<script>

  // ==========================================================
  // HELPERS
  // ==========================================================

  const allyCodeInput =
    document.getElementById("allyCode");

  const statusElement =
    document.getElementById("status");

  const arenaButton =
    document.getElementById("arenaButton");


  function setStatus(
    message,
    type = ""
  ) {

    statusElement.textContent =
      message;

    statusElement.className =
      "status visible " + type;
  }


  function clearStatus() {

    statusElement.textContent =
      "";

    statusElement.className =
      "status";
  }


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  function getAllyCode() {

    const value =
      allyCodeInput.value
        .trim()
        .replace(/\s+/g, "");

    if (!value) {
      throw new Error(
        "Введите Ally Code."
      );
    }

    if (!/^\d+$/.test(value)) {
      throw new Error(
        "Ally Code должен содержать только цифры."
      );
    }

    return value;
  }


  // ==========================================================
  // API
  // ==========================================================

  // GitHub Pages is a static host, so API requests must go to
  // the separate Arena Tracker proxy running on Render.
  // Set this to your proxy Render URL (not the Comlink URL).
  const API_BASE_URL =
    "https://arena-tracker-proxy.onrender.com";

  async function post(
    path,
    body
  ) {

    console.log(
      "POST",
      path,
      body
    );


    const response =
      await fetch(
        `${API_BASE_URL}${path}`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );


    const raw =
      await response.text();


    let data;

    try {
      data =
        JSON.parse(raw);
    } catch {
      data =
        raw;
    }


    console.log(
      "RESPONSE",
      response.status,
      data
    );


    if (!response.ok) {

      if (
        data &&
        typeof data === "object" &&
        data.error
      ) {

        throw new Error(
          data.error
        );
      }


      throw new Error(
        `Сервер вернул ошибку ${response.status}.`
      );
    }


    return data;
  }


  // ==========================================================
  // MAIN
  // ==========================================================

  async function loadArena() {

    try {

      const allyCode =
        getAllyCode();


      arenaButton.disabled =
        true;


      setStatus(
        "Получаю данные Arena…"
      );


      /*
        ЕДИНСТВЕННЫЙ запрос к Comlink.

        Никакого /player.

        /playerArena уже содержит
        нужную информацию о игроке.
      */

      const data =
        await post(
          "/playerArena",
          {
            allyCode
          }
        );


      console.log(
        "ARENA DATA",
        data
      );


      renderEverything(
        data,
        allyCode
      );


      setStatus(
        "Arena успешно загружена.",
        "success"
      );

    } catch (error) {

      console.error(
        "Arena error:",
        error
      );


      setStatus(
        error.message ||
        "Не удалось получить данные.",
        "error"
      );

    } finally {

      arenaButton.disabled =
        false;
    }
  }


  // ==========================================================
  // RENDER EVERYTHING
  // ==========================================================

  function renderEverything(
    data,
    allyCode
  ) {

    renderPlayer(
      data,
      allyCode
    );

    renderSquad(
      data
    );

    renderDatacron(
      data
    );
  }


  // ==========================================================
  // PLAYER
  // ==========================================================

  function renderPlayer(
    data,
    allyCode
  ) {

    const section =
      document.getElementById(
        "playerSection"
      );


    section.classList.add(
      "visible"
    );


    const name =
      data?.name ||
      data?.player?.name ||
      data?.playerData?.name ||
      "Unknown";


    const level =
      data?.level ??
      data?.player?.level ??
      data?.playerData?.level ??
      "—";


    document.getElementById(
      "playerName"
    ).textContent =
      name;


    document.getElementById(
      "playerMeta"
    ).textContent =
      `Level ${level} · Ally Code ${allyCode}`;


    const profiles =
      Array.isArray(
        data?.pvpProfile
      )
        ? data.pvpProfile
        : [];


    let squadRank =
      "—";

    let fleetRank =
      "—";


    if (profiles[0]) {

      squadRank =
        profiles[0].rank ??
        "—";
    }


    if (profiles[1]) {

      fleetRank =
        profiles[1].rank ??
        "—";
    }


    document.getElementById(
      "squadRank"
    ).textContent =
      squadRank;


    document.getElementById(
      "fleetRank"
    ).textContent =
      fleetRank;


    const skillRating =
      data?.playerRating
        ?.playerSkillRating
        ?.skillRating ??
      data?.player?.playerRating
        ?.playerSkillRating
        ?.skillRating ??
      "—";


    document.getElementById(
      "skillRating"
    ).textContent =
      skillRating;
  }


  // ==========================================================
  // SQUAD
  // ==========================================================

  function renderSquad(
    data
  ) {

    const section =
      document.getElementById(
        "squadSection"
      );

    const container =
      document.getElementById(
        "squad"
      );


    section.classList.add(
      "visible"
    );


    container.innerHTML =
      "";


    const cells =
      data?.pvpProfile?.[0]
        ?.squad?.cell;


    if (
      !Array.isArray(cells) ||
      cells.length === 0
    ) {

      container.innerHTML =
        `
        <div class="empty">
          Команда не найдена.
        </div>
        `;

      return;
    }


    const sorted =
      [...cells].sort(
        (a, b) =>
          Number(
            a.cellIndex ?? 0
          ) -
          Number(
            b.cellIndex ?? 0
          )
      );


    for (
      const cell of sorted
    ) {

      const unitDefId =
        cell?.unitDefId ||
        cell?.unit?.unitDefId ||
        "";


      createUnitCard(
        container,
        unitDefId
      );
    }
  }


  // ==========================================================
  // UNIT
  // ==========================================================

  function createUnitCard(
    container,
    unitDefId
  ) {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "unit-card";


    const imageWrap =
      document.createElement(
        "div"
      );

    imageWrap.className =
      "unit-image-wrap";


    imageWrap.innerHTML =
      `
      <div class="unit-placeholder">
        …
      </div>
      `;


    const name =
      document.createElement(
        "div"
      );

    name.className =
      "unit-name";

    name.textContent =
      prettyUnitName(
        unitDefId
      );


    card.appendChild(
      imageWrap
    );

    card.appendChild(
      name
    );


    container.appendChild(
      card
    );


    if (!unitDefId) {
      return;
    }


    loadPortrait(
      unitDefId,
      imageWrap
    );
  }


  async function loadPortrait(
    unitDefId,
    imageWrap
  ) {

    try {

      const result =
        await post(
          "/characterImage",
          {
            unitDefId
          }
        );


      if (
        !result?.ok ||
        !result?.url
      ) {

        imageWrap.innerHTML =
          `
          <div class="unit-placeholder">
            ?
          </div>
          `;

        return;
      }


      const image =
        document.createElement(
          "img"
        );


      image.className =
        "unit-image";


      image.alt =
        prettyUnitName(
          unitDefId
        );


      image.src =
        result.url;


      image.onerror =
        () => {

          imageWrap.innerHTML =
            `
            <div class="unit-placeholder">
              ?
            </div>
            `;
        };


      imageWrap.innerHTML =
        "";


      imageWrap.appendChild(
        image
      );

    } catch (error) {

      console.error(
        "Portrait error:",
        unitDefId,
        error
      );


      imageWrap.innerHTML =
        `
        <div class="unit-placeholder">
          ?
        </div>
        `;
    }
  }


  // ==========================================================
  // DATACRON
  // ==========================================================

  function renderDatacron(
    data
  ) {

    const section =
      document.getElementById(
        "datacronSection"
      );

    const container =
      document.getElementById(
        "datacron"
      );


    const datacron =
      data?.pvpProfile?.[0]
        ?.squad?.datacron ||
      data?.pvpProfile?.[0]
        ?.datacron ||
      data?.datacron;


    if (!datacron) {

      section.classList.remove(
        "visible"
      );

      container.innerHTML =
        "";

      return;
    }


    section.classList.add(
      "visible"
    );


    const id =
      datacron.id ??
      "—";


    const setId =
      datacron.setId ??
      "—";


    const tier =
      datacron.highestTierApplied ??
      "—";


    const affixes =
      Array.isArray(
        datacron.affixes
      )
        ? datacron.affixes
        : [];


    let affixesHtml =
      "";


    if (affixes.length) {

      affixesHtml =
        `
        <div class="affixes">

          ${
            affixes
              .map(
                affix =>
                  `
                  <div class="affix">
                    ${
                      escapeHtml(
                        typeof affix === "string"
                          ? affix
                          : JSON.stringify(
                              affix
                            )
                      )
                    }
                  </div>
                  `
              )
              .join("")
          }

        </div>
        `;
    }


    container.innerHTML =
      `
      <div class="datacron-id">
        ${escapeHtml(id)}
      </div>

      <div class="datacron-meta">
        Set ${escapeHtml(setId)}
        · Tier ${escapeHtml(tier)}
      </div>

      ${affixesHtml}
      `;
  }


  // ==========================================================
  // NAMES
  // ==========================================================

  function prettyUnitName(
    unitDefId
  ) {

    if (!unitDefId) {
      return "Unknown";
    }


    const base =
      String(unitDefId)
        .split(":")[0];


    const names = {

      GLLEIA:
        "GL Leia",

      CAPTAINDROGAN:
        "Captain Drogan",

      R2D2_LEGENDARY:
        "R2-D2",

      CAPTAINREX:
        "Captain Rex",

      C3POCHEWBACCA:
        "Threepio & Chewie",

      JABBATHEHUTT:
        "Jabba",

      LORDVADER:
        "Lord Vader",

      DARTHVADER:
        "Darth Vader",

      REY:
        "Rey",

      SUPREMELEADERKYLOREN:
        "Supreme Leader Kylo Ren",

      KYLOREN:
        "Kylo Ren",

      LUKEHERMITLEGENDARY:
        "Jedi Master Luke",

      PALPATINE:
        "Emperor Palpatine",

      GRANDMASTERYODA:
        "Grand Master Yoda"
    };


    if (names[base]) {
      return names[base];
    }


    return base
      .replace(
        /_/g,
        " "
      )
      .replace(
        /\b\w/g,
        letter =>
          letter.toUpperCase()
      );
  }


  // ==========================================================
  // ENTER
  // ==========================================================

  allyCodeInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {
        loadArena();
      }

    }
  );

</script>

</body>
</html>
