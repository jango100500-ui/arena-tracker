<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(680px,100%);margin:auto;padding:28px 18px}
h1{font-size:28px;margin:0 0 8px}
p{color:#999;margin:0 0 24px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;background:#1c1c1c;border:1px solid #333;border-radius:10px;color:#fff;padding:14px;font-size:16px}
button{background:#252525;border:1px solid #444;color:#fff;border-radius:10px;padding:14px 18px;font-size:15px;cursor:pointer}
button:hover{background:#303030}
.buttons{display:flex;gap:10px;margin-top:12px}
.result{margin-top:24px;background:#191919;border-radius:12px;padding:18px}
.info{font-size:17px;line-height:1.8}
.label{color:#888}
.jsonbox{margin-top:18px;background:#161616;border-radius:12px;overflow:hidden}
.jsonhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#202020;color:#aaa}
.copy{padding:6px 10px;font-size:13px}
pre{margin:0;padding:14px;max-height:500px;overflow:auto;font-size:12px;line-height:1.5;color:#bbb;white-space:pre-wrap;word-break:break-word}
.error{color:#ff7777}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Arena Tracker</h1>
<p>Введите Ally Code и выберите нужный раздел</p>

<div class="row">
<input id="allyCode" inputmode="numeric" placeholder="Ally Code">
</div>

<div class="buttons">
<button onclick="loadArena()">Арена</button>
<button onclick="loadProfile()">Профиль</button>
</div>

<div id="result" class="result hidden">
<div id="info" class="info"></div>

<div class="jsonbox">
<div class="jsonhead">
<span>Код</span>
<button class="copy" onclick="copyJson()">Копировать</button>
</div>
<pre id="json"></pre>
</div>
</div>
</main>

<script>
const API="https://arena-tracker-proxy.onrender.com";

let currentJson="";

function code(){
    const value=document.getElementById("allyCode").value.replace(/\D/g,"");
    if(!value){
        showError("Введите Ally Code");
        return null;
    }
    return value;
}

function showError(message){
    const result=document.getElementById("result");
    result.classList.remove("hidden");
    document.getElementById("info").innerHTML=`<div class="error">${message}</div>`;
    document.getElementById("json").textContent="";
}

function findValue(obj,keys){
    if(!obj||typeof obj!=="object") return null;
    for(const key of keys){
        if(Object.prototype.hasOwnProperty.call(obj,key)&&typeof obj[key]==="string"&&obj[key]) return obj[key];
    }
    for(const value of Object.values(obj)){
        if(value&&typeof value==="object"){
            const found=findValue(value,keys);
            if(found) return found;
        }
    }
    return null;
}

function show(data,type){
    currentJson=JSON.stringify(data,null,2);
    document.getElementById("result").classList.remove("hidden");
    document.getElementById("json").textContent=currentJson;

    if(type==="arena"){
        const profile=Array.isArray(data.pvpProfile)?data.pvpProfile[0]:null;
        const rank=profile?.rank ?? findValue(data,["rank"]);
        const name=findValue(data,["playerName","name","displayName"]);
        const title=findValue(data,["title","playerTitle"]);
        const guild=findValue(data,["guildName"]);

        document.getElementById("info").innerHTML=`
            ${rank!=null?`<div><span class="label">Место:</span> ${rank}</div>`:""}
            ${name?`<div><span class="label">Имя:</span> ${name}</div>`:""}
            ${title?`<div><span class="label">Титул:</span> ${title}</div>`:""}
            ${guild?`<div><span class="label">Гильдия:</span> ${guild}</div>`:""}
        `;
    }else{
        const name=findValue(data,["playerName","name","displayName"]);
        const guild=findValue(data,["guildName"]);
        document.getElementById("info").innerHTML=`
            ${name?`<div><span class="label">Имя:</span> ${name}</div>`:""}
            ${guild?`<div><span class="label">Гильдия:</span> ${guild}</div>`:""}
        `;
    }
}

async function request(url,type){
    const allyCode=code();
    if(!allyCode) return;

    document.getElementById("result").classList.remove("hidden");
    document.getElementById("info").textContent="Загрузка...";
    document.getElementById("json").textContent="";

    try{
        const response=await fetch(`${API}/${url}?allyCode=${allyCode}`);
        const data=await response.json();

        if(!response.ok){
            throw new Error(data.error||`HTTP ${response.status}`);
        }

        show(data,type);
    }catch(error){
        showError(error.message);
    }
}

function loadArena(){
    request("arena","arena");
}

function loadProfile(){
    request("profile","profile");
}

async function copyJson(){
    if(!currentJson) return;
    await navigator.clipboard.writeText(currentJson);
}
</script>
</body>
</html>
