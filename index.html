<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>SWGOH Arena Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b0d12;
      color: #f4f4f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      padding: 18px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-user-select: none;
      user-select: none;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      margin-bottom: 18px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 5px;
      color: #858b98;
      font-size: 14px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-card {
      background: #14171e;
      border: 1px solid #252a34;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .input-row {
      display: flex;
      gap: 9px;
    }

    input {
      min-width: 0;
      flex: 1;

      background: #0e1015;
      color: white;

      border: 1px solid #2b303a;
      border-radius: 11px;

      padding: 12px 13px;
      outline: none;

      -webkit-user-select: text;
      user-select: text;
    }

    input:focus {
      border-color: #4c5565;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 0 16px;

      background: #e8e9eb;
      color: #111318;

      font-weight: 700;
      cursor: pointer;

      min-height: 43px;
    }

    button:active {
      transform: scale(0.98);
    }

    .buttons {
      display: flex;
      gap: 9px;
      margin-top: 10px;
    }

    .buttons button {
      flex: 1;
    }

    .secondary {
      background: #252a34;
      color: #f3f4f6;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: none;

      padding: 11px 13px;
      margin-bottom: 16px;

      background: #14171e;
      border: 1px solid #252a34;
      border-radius: 12px;

      color: #aeb4c0;
      font-size: 14px;

      word-break: break-word;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #ff7777;
      border-color: #512b2b;
    }

    /* =========================
       PLAYER CARD
    ========================= */

    .player-card {
      display: none;

      background: #14171e;
      border: 1px solid #252a34;
      border-radius: 16px;

      padding: 16px;
      margin-bottom: 16px;
    }

    .player-card.show {
      display: block;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .player-name {
      font-size: 21px;
      font-weight: 800;
    }

    .player-meta {
      margin-top: 5px;
      color: #858b98;
      font-size: 13px;
    }

    .rank-box {
      text-align: right;
      white-space: nowrap;
    }

    .rank-label {
      color: #858b98;
      font-size: 12px;
    }

    .rank {
      margin-top: 2px;
      font-size: 27px;
      font-weight: 800;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section-title {
      margin: 20px 0 10px;
      font-size: 17px;
      font-weight: 800;
    }

    /* =========================
       ARENA
    ========================= */

    .arena-card {
      background: #14171e;
      border: 1px solid #252a34;
      border-radius: 16px;
      overflow: hidden;
    }

    .arena-row {
      display: grid;
      grid-template-columns: 55px 1fr;
      gap: 12px;

      align-items: center;

      min-height: 84px;
      padding: 10px 13px;

      border-bottom: 1px solid #252a34;
    }

    .arena-row:last-child {
      border-bottom: 0;
    }

    .arena-row.me {
      background: #191d26;
    }

    .position {
      font-size: 18px;
      font-weight: 800;
      color: #aeb4c0;
      text-align: center;
    }

    .arena-row.me .position {
      color: white;
    }

    .opponent {
      min-width: 0;
    }

    .opponent-name {
      font-size: 15px;
      font-weight: 700;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .opponent-code {
      margin-top: 3px;
      color: #727887;
      font-size: 12px;
    }

    /* =========================
       SQUAD
    ========================= */

    .squad-card {
      background: #14171e;
      border: 1px solid #252a34;
      border-radius: 16px;
      padding: 14px;
    }

    .squad {
      display: grid;
      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 8px;
    }

    .unit {
      min-width: 0;
      text-align: center;
    }

    .portrait-wrap {
      width: 100%;
      aspect-ratio: 1;

      background: #0b0d12;
      border: 1px solid #303641;
      border-radius: 12px;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portrait {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .portrait-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #4c5260;
      font-size: 24px;
    }

    .unit-name {
      margin-top: 5px;

      font-size: 10px;
      line-height: 1.15;

      color: #aeb4c0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================
       DATACRON
    ========================= */

    .datacron {
      margin-top: 14px;

      padding: 12px;

      background: #0e1015;
      border: 1px solid #252a34;
      border-radius: 11px;
    }

    .datacron-title {
      font-size: 13px;
      font-weight: 800;
    }

    .datacron-text {
      margin-top: 4px;
      color: #858b98;
      font-size: 12px;
      line-height: 1.45;
    }

    /* =========================
       DEBUG
    ========================= */

    details {
      margin-top: 18px;
    }

    summary {
      cursor: pointer;
      color: #777e8d;
      font-size: 13px;
    }

    pre {
      margin-top: 10px;

      max-height: 400px;
      overflow: auto;

      background: #07080b;
      border: 1px solid #20242c;
      border-radius: 10px;

      padding: 12px;

      color: #aeb4c0;
      font-size: 11px;

      white-space: pre-wrap;
      word-break: break-word;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 520px) {

      body {
        padding: 12px;
      }

      .title {
        font-size: 24px;
      }

      .input-row {
        flex-direction: column;
      }

      .player-top {
        align-items: flex-start;
      }

      .rank {
        font-size: 24px;
      }

      .arena-row {
        grid-template-columns: 45px 1fr;
      }

      .squad {
        gap: 5px;
      }

      .unit-name {
        font-size: 9px;
      }

    }
  </style>
</head>


<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="title">
      SWGOH Arena Tracker
    </div>

    <div class="subtitle">
      Squad Arena · Live data
    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-card">

    <div class="input-row">

      <input
        id="allyCode"
        type="text"
        inputmode="numeric"
        placeholder="Ally Code"
        autocomplete="off"
      >

      <button
        id="arenaButton"
        onclick="loadArena()"
      >
        Получить Arena
      </button>

    </div>


    <div class="buttons">

      <button
        class="secondary"
        onclick="loadPlayer()"
      >
        Получить профиль
      </button>

      <button
        class="secondary"
        onclick="testPortraits()"
      >
        Test portraits
      </button>

    </div>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  ></div>


  <!-- PLAYER -->

  <div
    id="playerCard"
    class="player-card"
  >

    <div class="player-top">

      <div>

        <div
          id="playerName"
          class="player-name"
        >
          —
        </div>

        <div
          id="playerMeta"
          class="player-meta"
        >
          —
        </div>

      </div>


      <div class="rank-box">

        <div class="rank-label">
          Squad Arena
        </div>

        <div
          id="playerRank"
          class="rank"
        >
          —
        </div>

      </div>

    </div>

  </div>


  <!-- ARENA -->

  <div
    id="arenaSection"
    style="display:none"
  >

    <div class="section-title">
      Arena
    </div>

    <div
      id="arena"
      class="arena-card"
    ></div>

  </div>


  <!-- SQUAD -->

  <div
    id="squadSection"
    style="display:none"
  >

    <div class="section-title">
      Squad
    </div>

    <div class="squad-card">

      <div
        id="squad"
        class="squad"
      ></div>


      <div
        id="datacron"
        class="datacron"
        style="display:none"
      >

        <div class="datacron-title">
          Datacron
        </div>

        <div
          id="datacronText"
          class="datacron-text"
        ></div>

      </div>

    </div>

  </div>


  <!-- DEBUG -->

  <details>

    <summary>
      Debug Console
    </summary>

    <pre id="debug"></pre>

  </details>

</div>


<script>

  /* =====================================================
     CONFIG
  ===================================================== */

  const PROXY =
    "https://arena-tracker-proxy.onrender.com";


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const allyCodeInput =
    document.getElementById(
      "allyCode"
    );

  const statusEl =
    document.getElementById(
      "status"
    );

  const debugEl =
    document.getElementById(
      "debug"
    );

  const playerCard =
    document.getElementById(
      "playerCard"
    );

  const playerName =
    document.getElementById(
      "playerName"
    );

  const playerMeta =
    document.getElementById(
      "playerMeta"
    );

  const playerRank =
    document.getElementById(
      "playerRank"
    );

  const arenaSection =
    document.getElementById(
      "arenaSection"
    );

  const arenaEl =
    document.getElementById(
      "arena"
    );

  const squadSection =
    document.getElementById(
      "squadSection"
    );

  const squadEl =
    document.getElementById(
      "squad"
    );

  const datacronEl =
    document.getElementById(
      "datacron"
    );

  const datacronText =
    document.getElementById(
      "datacronText"
    );


  /* =====================================================
     STATUS
  ===================================================== */

  function setStatus(
    text,
    error = false
  ) {

    statusEl.textContent = text;

    statusEl.classList.add(
      "show"
    );

    statusEl.classList.toggle(
      "error",
      error
    );

  }


  function clearStatus() {

    statusEl.textContent = "";

    statusEl.classList.remove(
      "show",
      "error"
    );

  }


  /* =====================================================
     DEBUG
  ===================================================== */

  function debug(data) {

    try {

      debugEl.textContent =
        typeof data === "string"
          ? data
          : JSON.stringify(
              data,
              null,
              2
            );

    } catch {

      debugEl.textContent =
        String(data);

    }

  }


  /* =====================================================
     ALLY CODE
  ===================================================== */

  function getAllyCode() {

    return allyCodeInput.value
      .replace(/\D/g, "");

  }


  /* =====================================================
     POST
  ===================================================== */

  async function post(
    endpoint,
    body
  ) {

    const response =
      await fetch(
        `${PROXY}${endpoint}`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );


    const text =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(text);

    } catch {

      data = text;

    }


    if (!response.ok) {

      throw new Error(
        typeof data === "object"
          ? JSON.stringify(data)
          : data
      );

    }


    return data;

  }


  /* =====================================================
     ARENA
  ===================================================== */

  async function loadArena() {

    const allyCode =
      getAllyCode();


    if (!allyCode) {

      setStatus(
        "Введите Ally Code",
        true
      );

      return;

    }


    setStatus(
      "Получаю Arena..."
    );


    try {

      /*
       * ВАЖНО:
       * Comlink ожидает именно allycode,
       * а не allyCode.
       */

      const data =
        await post(
          "/playerArena",
          {
            allycode:
              Number(allyCode)
          }
        );


      debug(data);


      renderArena(data);


      setStatus(
        "Arena загружена"
      );


    } catch (error) {

      console.error(
        error
      );


      setStatus(
        `Ошибка: ${error.message}`,
        true
      );

    }

  }


  /* =====================================================
     PLAYER
  ===================================================== */

  async function loadPlayer() {

    const allyCode =
      getAllyCode();


    if (!allyCode) {

      setStatus(
        "Введите Ally Code",
        true
      );

      return;

    }


    setStatus(
      "Получаю профиль..."
    );


    try {

      /*
       * Здесь тоже allycode.
       */

      const data =
        await post(
          "/player",
          {
            allycode:
              Number(allyCode)
          }
        );


      debug(data);


      renderPlayer(
        data
      );


      setStatus(
        "Профиль загружен"
      );


    } catch (error) {

      console.error(
        error
      );


      setStatus(
        `Ошибка: ${error.message}`,
        true
      );

    }

  }


  /* =====================================================
     PLAYER RENDER
  ===================================================== */

  function renderPlayer(
    data
  ) {

    const player =
      data?.player ||
      data;


    const name =
      player?.name ||
      player?.playerName ||
      "Unknown Player";


    const level =
      player?.level ??
      player?.playerLevel;


    playerName.textContent =
      name;


    playerMeta.textContent =
      level
        ? `Level ${level}`
        : "SWGOH Player";


    playerCard.classList.add(
      "show"
    );

  }


  /* =====================================================
     ARENA RENDER
  ===================================================== */

  function renderArena(
    data
  ) {

    const profiles =
      data?.pvpProfile ||
      [];


    const squadArena =
      profiles[0];


    const rank =
      squadArena?.rank;


    const player =
      data?.player ||
      data;


    const name =
      player?.name ||
      data?.name ||
      "Unknown Player";


    playerName.textContent =
      name;


    playerRank.textContent =
      rank ??
      "—";


    playerMeta.textContent =
      player?.level
        ? `Level ${player.level}`
        : "Squad Arena";


    playerCard.classList.add(
      "show"
    );


    /*
     * Arena cells.
     */

    const cells =
      squadArena?.squad?.cell ||
      [];


    const sorted =
      [...cells].sort(
        (a, b) =>
          Number(
            a.cellIndex ?? 0
          ) -
          Number(
            b.cellIndex ?? 0
          )
      );


    arenaEl.innerHTML = "";


    if (!sorted.length) {

      arenaEl.innerHTML = `

        <div class="arena-row">

          <div class="position">
            —
          </div>

          <div class="opponent-name">
            Нет данных Arena
          </div>

        </div>

      `;

    } else {

      for (
        const cell
        of sorted
      ) {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "arena-row";


        const position =
          cell.cellIndex ??
          "—";


        const opponentName =
          cell.player?.name ||
          cell.name ||
          "Opponent";


        const allyCode =
          cell.player?.allyCode ||
          cell.allyCode ||
          "";


        row.innerHTML = `

          <div class="position">
            ${escapeHtml(
              String(position)
            )}
          </div>

          <div class="opponent">

            <div class="opponent-name">
              ${escapeHtml(
                opponentName
              )}
            </div>

            <div class="opponent-code">

              ${
                allyCode
                  ? `Ally Code ${escapeHtml(
                      String(
                        allyCode
                      )
                    )}`
                  : ""
              }

            </div>

          </div>

        `;


        arenaEl.appendChild(
          row
        );

      }

    }


    arenaSection.style.display =
      "block";


    /*
     * Squad.
     */

    renderSquad(
      cells
    );

  }


  /* =====================================================
     SQUAD
  ===================================================== */

  async function renderSquad(
    cells
  ) {

    squadEl.innerHTML = "";


    /*
     * Ищем unitDefId рекурсивно.
     * Это надёжнее, чем предполагать
     * конкретную структуру Comlink.
     */

    const found =
      findUnitDefIds(
        cells
      );


    const uniqueUnits =
      [...new Set(found)]
        .slice(0, 5);


    if (!uniqueUnits.length) {

      squadSection.style.display =
        "none";

      return;

    }


    squadSection.style.display =
      "block";


    const elements = [];


    /*
     * Сначала создаём все карточки.
     */

    for (
      const unitDefId
      of uniqueUnits
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "unit";


      wrapper.innerHTML = `

        <div class="portrait-wrap">

          <div class="portrait-placeholder">
            …
          </div>

        </div>

        <div class="unit-name">
          ${escapeHtml(
            cleanUnitName(
              unitDefId
            )
          )}
        </div>

      `;


      squadEl.appendChild(
        wrapper
      );


      elements.push({
        unitDefId,
        wrapper
      });

    }


    /*
     * Теперь параллельно запрашиваем
     * картинки у Proxy.
     */

    await Promise.all(

      elements.map(
        async ({
          unitDefId,
          wrapper
        }) => {

          try {

            const result =
              await post(
                "/characterImage",
                {
                  unitDefId
                }
              );


            console.log(
              "[Portrait]",
              unitDefId,
              result
            );


            if (
              result?.ok &&
              result?.url
            ) {

              const image =
                document.createElement(
                  "img"
                );


              image.className =
                "portrait";


              image.alt =
                result.name ||
                unitDefId;


              image.loading =
                "lazy";


              image.src =
                result.url;


              const portraitWrap =
                wrapper.querySelector(
                  ".portrait-wrap"
                );


              portraitWrap.innerHTML =
                "";


              portraitWrap.appendChild(
                image
              );


              image.onerror =
                () => {

                  portraitWrap.innerHTML = `

                    <div class="portrait-placeholder">
                      ?
                    </div>

                  `;

                };


              const nameEl =
                wrapper.querySelector(
                  ".unit-name"
                );


              if (
                nameEl &&
                result.name
              ) {

                nameEl.textContent =
                  result.name;

              }

            } else {

              console.warn(
                "Portrait not found:",
                unitDefId,
                result
              );

            }

          } catch (error) {

            console.error(
              "Portrait error:",
              unitDefId,
              error
            );

          }

        }
      )

    );


    renderDatacron(
      cells
    );

  }


  /* =====================================================
     FIND UNIT DEF IDS
  ===================================================== */

  function findUnitDefIds(
    value,
    result = []
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return result;

    }


    if (
      typeof value === "object"
    ) {

      if (
        typeof value.unitDefId ===
        "string"
      ) {

        result.push(
          value.unitDefId
        );

      }


      for (
        const key
        of Object.keys(value)
      ) {

        findUnitDefIds(
          value[key],
          result
        );

      }

    }


    return result;

  }


  /* =====================================================
     DATACRON
  ===================================================== */

  function renderDatacron(
    cells
  ) {

    const found =
      findDatacron(
        cells
      );


    if (!found) {

      datacronEl.style.display =
        "none";

      return;

    }


    const id =
      found.id ||
      found.datacronId ||
      "Unknown";


    const setId =
      found.setId ||
      "—";


    const tier =
      found.highestTierApplied ??
      "—";


    datacronText.innerHTML = `

      ID: ${escapeHtml(
        String(id)
      )}

      <br>

      Set: ${escapeHtml(
        String(setId)
      )}

      <br>

      Tier: ${escapeHtml(
        String(tier)
      )}

    `;


    datacronEl.style.display =
      "block";

  }


  function findDatacron(
    value
  ) {

    if (
      !value ||
      typeof value !==
        "object"
    ) {

      return null;

    }


    if (
      value.datacron &&
      typeof value.datacron ===
        "object"
    ) {

      return value.datacron;

    }


    if (
      value.datacronId
    ) {

      return value;

    }


    for (
      const key
      of Object.keys(value)
    ) {

      const result =
        findDatacron(
          value[key]
        );


      if (result) {

        return result;

      }

    }


    return null;

  }


  /* =====================================================
     PORTRAIT STATUS TEST
  ===================================================== */

  async function testPortraits() {

    setStatus(
      "Проверяю систему портретов..."
    );


    try {

      const response =
        await fetch(
          `${PROXY}/portraitStatus`
        );


      const data =
        await response.json();


      debug(data);


      setStatus(
        `Портретов найдено: ${
          data.portraits ??
          "?"
        }`
      );


    } catch (error) {

      setStatus(
        `Ошибка портретов: ${error.message}`,
        true
      );

    }

  }


  /* =====================================================
     UNIT NAME
  ===================================================== */

  function cleanUnitName(
    unitDefId
  ) {

    return String(
      unitDefId || ""
    )

      .replace(
        /:SEVEN_STAR$/i,
        ""
      )

      .replace(
        /:SIX_STAR$/i,
        ""
      )

      .replace(
        /:FIVE_STAR$/i,
        ""
      )

      .replace(
        /:FOUR_STAR$/i,
        ""
      )

      .replace(
        /_LEGENDARY$/i,
        ""
      )

      .replace(
        /_/g,
        " "
      );

  }


  /* =====================================================
     HTML ESCAPE
  ===================================================== */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =====================================================
     ENTER
  ===================================================== */

  allyCodeInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key ===
        "Enter"
      ) {

        loadArena();

      }

    }
  );

</script>
