<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWGOH Comlink Test</title>
</head>
<body>

  <h1>SWGOH Comlink Test</h1>

<input
id="allyCode"
type="text"
inputmode="numeric"
maxlength="9"
placeholder="Ally Code"

>

<button onclick="getData()">Получить данные</button>

  <p id="status"></p>

  <pre id="result"></pre>

  <script>
    async function getData() {
      const allyCode = document.getElementById("allyCode").value.trim();
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      result.textContent = "";

      if (!/^[1-9]{9}$/.test(allyCode)) {
        status.textContent = "Введите 9 цифр Ally Code.";
        return;
      }

      status.textContent = "Запрашиваю данные...";

      try {
        const response = await fetch(
          "https://arena-tracker-2uod.onrender.com/playerArena",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              payload: {
                allyCode: allyCode
              }
            })
          }
        );

        const text = await response.text();

        status.textContent =
          "HTTP " + response.status;

        try {
          const json = JSON.parse(text);

          result.textContent =
            JSON.stringify(json, null, 2);
        } catch {
          result.textContent = text;
        }

      } catch (error) {
        status.textContent = "Ошибка запроса";
        result.textContent = error.toString();
      }
    }
  </script>

</body>
</html>
