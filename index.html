<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Tracker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101114;color:#f4f4f5}
body{padding:24px 16px}
.app{width:min(900px,100%);margin:0 auto}
h1{margin:0 0 8px;font-size:28px}
.subtitle{margin:0 0 22px;color:#8f929a}
.input-row{display:flex;gap:10px;margin-bottom:10px}
input{flex:1;min-width:0;padding:13px 15px;border:1px solid #303239;border-radius:12px;background:#18191d;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#666a74}
button{border:0;border-radius:12px;padding:13px 18px;background:#e8e8ea;color:#111;font-size:15px;font-weight:600;cursor:pointer}
button.secondary{background:#292b31;color:#f4f4f5}
button.danger{background:#4a2529;color:#ffb5b5}
button:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px}
.monitor-actions{display:flex;gap:10px;margin-top:10px}
.status{min-height:24px;margin:14px 0;color:#8f929a}
.card{background:#18191d;border:1px solid #292b31;border-radius:16px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:20px}
.player-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.info{background:#202126;border-radius:12px;padding:12px}
.info-label{font-size:12px;color:#858892;margin-bottom:5px}
.info-value{font-size:15px;word-break:break-word}
.rank{font-size:24px;font-weight:700;margin-bottom:16px}
.arena-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.unit{text-align:center;min-width:0}
.unit-portrait{width:82px;height:82px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;padding:3px;background:#292b31}
.unit-portrait.light{background:#4b8ed8}
.unit-portrait.dark{background:#b13f4c}
.unit-portrait.neutral{background:#8a8d94}
.unit-portrait.galactic_legend{background:#d6a73a}
.unit-image{width:100%;height:100%;border-radius:50%;background:#0b0c0e;object-fit:cover;display:block}
.unit-name{margin-top:8px;font-size:12px;line-height:1.2;min-height:29px;word-break:break-word;color:#e1e2e5}
.stars{height:16px;margin-top:4px;font-size:11px;letter-spacing:-1px;white-space:nowrap}
.star-on{color:#f0d76b}
.star-off{color:#41434a}
.progress{margin-top:3px;font-size:11px;color:#aeb0b7}
.title{font-size:16px;font-weight:600}
.monitor-card{display:flex;align-items:center;justify-content:space-between;gap:14px}
.monitor-title{font-size:18px;font-weight:700}
.monitor-meta{margin-top:5px;color:#8f929a;font-size:13px}
.monitor-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:7px}
.monitor-dot.on{background:#5fcf79}
.log-card{padding:0;overflow:hidden}
.log-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #292b31}
.log-title{font-size:20px;font-weight:700}
.log-empty{padding:24px 18px;color:#8f929a;text-align:center}
.log-entry{padding:18px;border-bottom:1px solid #292b31}
.log-entry:last-child{border-bottom:0}
.log-entry.win{border-left:3px solid #55c878}
.log-entry.loss{border-left:3px solid #d85b67}
.log-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.log-result{font-weight:800;font-size:15px}
.win .log-result{color:#65d184}
.loss .log-result{color:#ef727d}
.log-time{font-size:12px;color:#858892}
.log-rank{font-size:23px;font-weight:800;margin-top:8px}
.log-delta{font-size:13px;color:#aeb0b7;margin-left:7px}
.log-pack-title{margin-top:14px;font-size:12px;color:#858892}
.log-pack{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.log-unit{flex:0 0 54px;text-align:center}
.log-unit img{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#0b0c0e;border:2px solid #34363d}
.log-unit-name{font-size:9px;line-height:1.1;margin-top:4px;color:#c8cad0;word-break:break-word}
.json-card{background:#15161a;border-radius:14px;overflow:hidden;margin-top:20px}
.json-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#1d1e23}
.json-title{font-size:13px;color:#a9abb3}
.copy{padding:7px 11px;border-radius:8px;font-size:12px;background:#303239;color:#fff}
pre{margin:0;padding:14px;max-height:420px;overflow:auto;font-size:11px;line-height:1.45;color:#cfd1d7;white-space:pre-wrap;word-break:break-word}
.hidden{display:none}
.error{color:#ff8b8b}
@media(max-width:650px){
body{padding:18px 12px}
h1{font-size:24px}
.input-row{flex-direction:column}
.actions button,.monitor-actions button{flex:1}
.player-info{grid-template-columns:1fr}
.arena-grid{gap:8px}
.unit-portrait{width:68px;height:68px}
.unit-name{font-size:10px}
.stars{font-size:9px}
.progress{font-size:10px}
.monitor-card{align-items:flex-start;flex-direction:column}
.monitor-actions{width:100%}
.log-top{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
<h1>Arena Tracker</h1>
<p class="subtitle">Введи Ally Code и выбери нужный режим</p>

<div class="input-row">
<input id="allyCode" inputmode="numeric" autocomplete="off" placeholder="Ally Code">
</div>

<div class="actions">
<button id="arenaBtn">Арена</button>
<button id="profileBtn" class="secondary">Профиль</button>
</div>

<div class="status" id="status"></div>

<section id="result" class="hidden"></section>

<section class="card hidden" id="monitorCard">
<div class="monitor-card">
<div>
<div class="monitor-title"><span class="monitor-dot" id="monitorDot"></span>Мониторинг арены</div>
<div class="monitor-meta" id="monitorMeta">Остановлен</div>
</div>
<div class="monitor-actions">
<button id="monitorBtn">Запустить</button>
<button id="clearLogBtn" class="danger">Очистить</button>
</div>
</div>
</section>

<section class="card log-card hidden" id="logCard">
<div class="log-head">
<div class="log-title">История боёв</div>
</div>
<div id="log"></div>
</section>

<section class="json-card">
<div class="json-head">
<span class="json-title">Код</span>
<button id="copyBtn" class="copy">Копировать</button>
</div>
<pre id="json">{}</pre>
</section>
</div>

<script>
const API="https://arena-tracker-proxy.onrender.com";
const POLL_INTERVAL=5000;
const STORAGE_PREFIX="arena_tracker_history_";

const allyCode=document.getElementById("allyCode");
const arenaBtn=document.getElementById("arenaBtn");
const profileBtn=document.getElementById("profileBtn");
const status=document.getElementById("status");
const result=document.getElementById("result");
const json=document.getElementById("json");
const copyBtn=document.getElementById("copyBtn");
const monitorCard=document.getElementById("monitorCard");
const monitorBtn=document.getElementById("monitorBtn");
const clearLogBtn=document.getElementById("clearLogBtn");
const monitorDot=document.getElementById("monitorDot");
const monitorMeta=document.getElementById("monitorMeta");
const logCard=document.getElementById("logCard");
const log=document.getElementById("log");

let monitorTimer=null;
let monitoring=false;
let lastSnapshot=null;
let history=[];

function setLoading(value){
    arenaBtn.disabled=value;
    profileBtn.disabled=value;
}

function setStatus(text,error=false){
    status.textContent=text;
    status.className=error?"status error":"status";
}

function showJson(data){
    json.textContent=JSON.stringify(data,null,2);
}

function value(data,keys){
    for(const key of keys){
        if(data?.[key]!==undefined&&data?.[key]!==null&&data?.[key]!=="") return data[key];
    }
    return "—";
}

function escapeHtml(text){
    return String(text).replace(/[&<>"']/g,char=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[char]));
}

function renderStars(rarity){
    const value=Number(rarity)||0;
    let html="";
    for(let i=1;i<=7;i++){
        html+=`<span class="${i<=value?"star-on":"star-off"}">★</span>`;
    }
    return html;
}

function renderProgress(unit){
    const gear=Number(unit.gearTier)||0;
    const relic=Number(unit.relicTier)||0;
    if(relic>0&&gear>0) return `G${gear} · R${relic}`;
    if(relic>0) return `R${relic}`;
    if(gear>0) return `G${gear}`;
    return "";
}

function unitCard(unit){
    const id=unit.unitDefId||"";
    const alignment=unit.alignment||"neutral";
    const image=`${API}/characterImage?definitionId=${encodeURIComponent(id)}`;

    return `
        <div class="unit">
            <div class="unit-portrait ${escapeHtml(alignment)}">
                <img class="unit-image" src="${image}" alt="${escapeHtml(unit.name||unit.baseId||id)}" loading="lazy">
            </div>
            <div class="unit-name">${escapeHtml(unit.name||unit.baseId||id)}</div>
            <div class="stars">${renderStars(unit.rarity)}</div>
            <div class="progress">${escapeHtml(renderProgress(unit))}</div>
        </div>
    `;
}

function normalizeArena(data){
    const profiles=Array.isArray(data.pvpProfile)?data.pvpProfile:[];
    return profiles.map(profile=>({
        tab:profile.tab,
        rank:Number(profile.rank)||0,
        squad:(profile?.squad?.cell||[]).map(unit=>({
            id:unit.unitDefId||unit.definitionId||"",
            name:unit.name||unit.baseId||unit.unitDefId||"",
            image:`${API}/characterImage?definitionId=${encodeURIComponent(unit.unitDefId||unit.definitionId||"")}`
        }))
    }));
}

function getStorageKey(code){
    return `${STORAGE_PREFIX}${code}`;
}

function loadHistory(code){
    try{
        const data=JSON.parse(localStorage.getItem(getStorageKey(code))||"[]");
        history=Array.isArray(data)?data:[];
    }catch{
        history=[];
    }
    renderHistory();
}

function saveHistory(code){
    localStorage.setItem(getStorageKey(code),JSON.stringify(history.slice(0,500)));
}

function snapshotForTab(data,tab){
    return normalizeArena(data).find(item=>String(item.tab)===String(tab));
}

function makeSnapshot(data){
    const arenas=normalizeArena(data);
    return {
        time:Date.now(),
        arenas
    };
}

function addEvent(previous,current,tab){
    if(!previous||!current||previous.rank===current.rank) return;

    const delta=previous.rank-current.rank;
    const win=delta>0;
    const event={
        id:`${Date.now()}_${Math.random().toString(36).slice(2)}`,
        time:Date.now(),
        tab,
        from:previous.rank,
        to:current.rank,
        delta,
        result:win?"win":"loss",
        squad:current.squad
    };

    history.unshift(event);
    history=history.slice(0,500);
    saveHistory(allyCode.value.replace(/\D/g,""));
    renderHistory();
}

function monitorData(data){
    const snapshot=makeSnapshot(data);

    if(lastSnapshot){
        for(const current of snapshot.arenas){
            const previous=lastSnapshot.arenas.find(item=>String(item.tab)===String(current.tab));
            addEvent(previous,current,current.tab);
        }
    }

    lastSnapshot=snapshot;
    renderMonitorMeta();
}

function renderMonitorMeta(){
    if(!monitoring){
        monitorDot.classList.remove("on");
        monitorMeta.textContent=lastSnapshot
            ? `Последняя проверка: ${new Date(lastSnapshot.time).toLocaleTimeString("ru-RU")}`
            : "Остановлен";
        monitorBtn.textContent="Запустить";
        return;
    }

    monitorDot.classList.add("on");
    monitorBtn.textContent="Остановить";
    monitorMeta.textContent=`Проверка каждые ${POLL_INTERVAL/1000} сек · последняя: ${new Date(lastSnapshot?.time||Date.now()).toLocaleTimeString("ru-RU")}`;
}

function renderHistory(){
    if(!history.length){
        logCard.classList.remove("hidden");
        log.innerHTML=`<div class="log-empty">Изменений позиции пока нет</div>`;
        return;
    }

    logCard.classList.remove("hidden");

    log.innerHTML=history.map(event=>{
        const delta=Math.abs(event.delta);
        const arrow=event.result==="win"?"↑":"↓";
        const title=event.result==="win"?"ПОБЕДА":"ПОРАЖЕНИЕ";
        const text=event.result==="win"
            ?`#${event.from} → #${event.to}`
            :`#${event.from} → #${event.to}`;

        return `
            <article class="log-entry ${event.result}">
                <div class="log-top">
                    <div class="log-result">${event.result==="win"?"🟢":"🔴"} ${title}</div>
                    <div class="log-time">${new Date(event.time).toLocaleString("ru-RU")}</div>
                </div>
                <div class="log-rank">${escapeHtml(text)} <span class="log-delta">${arrow}${delta}</span></div>
                <div class="log-pack-title">Наш состав в момент события</div>
                <div class="log-pack">
                    ${(event.squad||[]).map(unit=>`
                        <div class="log-unit">
                            <img src="${escapeHtml(unit.image)}" alt="${escapeHtml(unit.name)}" loading="lazy">
                            <div class="log-unit-name">${escapeHtml(unit.name)}</div>
                        </div>
                    `).join("")}
                </div>
            </article>
        `;
    }).join("");
}

function renderArena(data){
    const profiles=Array.isArray(data.pvpProfile)?data.pvpProfile:[];
    const title=value(data,["title"]);
    const guild=value(data,["guildName","guild"]);
    const name=value(data,["name","playerName"]);

    result.innerHTML=`
        <div class="card">
            <h2>${escapeHtml(name)}</h2>
            <div class="player-info">
                <div class="info">
                    <div class="info-label">Титул</div>
                    <div class="info-value title">${escapeHtml(title)}</div>
                </div>
                <div class="info">
                    <div class="info-label">Гильдия</div>
                    <div class="info-value">${escapeHtml(guild)}</div>
                </div>
                <div class="info">
                    <div class="info-label">Ally Code</div>
                    <div class="info-value">${escapeHtml(value(data,["allyCode"]))}</div>
                </div>
            </div>
        </div>

        ${profiles.map(profile=>{
            const cells=profile?.squad?.cell||[];
            return `
                <div class="card">
                    <h2>Арена ${profile.tab||""}</h2>
                    <div class="rank">#${profile.rank??"—"}</div>
                    <div class="arena-grid">
                        ${cells.map(unitCard).join("")}
                    </div>
                </div>
            `;
        }).join("")}
    `;

    result.classList.remove("hidden");
    monitorCard.classList.remove("hidden");
}

function renderProfile(data){
    const name=value(data,["name","playerName"]);
    const title=value(data,["title"]);
    const guild=value(data,["guildName","guild"]);
    const level=value(data,["level"]);

    result.innerHTML=`
        <div class="card">
            <h2>${escapeHtml(name)}</h2>
            <div class="player-info">
                <div class="info">
                    <div class="info-label">Уровень</div>
                    <div class="info-value">${escapeHtml(level)}</div>
                </div>
                <div class="info">
                    <div class="info-label">Титул</div>
                    <div class="info-value title">${escapeHtml(title)}</div>
                </div>
                <div class="info">
                    <div class="info-label">Гильдия</div>
                    <div class="info-value">${escapeHtml(guild)}</div>
                </div>
            </div>
        </div>
    `;

    result.classList.remove("hidden");
}

async function fetchArena(){
    const code=allyCode.value.replace(/\D/g,"");

    if(!code) throw new Error("Введи Ally Code");

    const response=await fetch(`${API}/arena?allyCode=${encodeURIComponent(code)}`);
    const data=await response.json();

    if(!response.ok) throw new Error(data.error||`HTTP ${response.status}`);

    return data;
}

async function request(path,renderer){
    const code=allyCode.value.replace(/\D/g,"");

    if(!code){
        setStatus("Введи Ally Code",true);
        return;
    }

    setLoading(true);
    setStatus("Загрузка...");
    result.classList.add("hidden");

    try{
        const response=await fetch(`${API}${path}?allyCode=${encodeURIComponent(code)}`);
        const data=await response.json();

        if(!response.ok) throw new Error(data.error||`HTTP ${response.status}`);

        showJson(data);
        renderer(data);

        if(path==="/arena"){
            loadHistory(code);
            lastSnapshot=null;
            monitorData(data);
        }

        setStatus("");
    }catch(error){
        showJson({error:error.message});
        setStatus(error.message,true);
    }finally{
        setLoading(false);
    }
}

async function poll(){
    if(!monitoring) return;

    try{
        const data=await fetchArena();
        showJson(data);
        monitorData(data);
        setStatus("");
    }catch(error){
        setStatus(`Мониторинг: ${error.message}`,true);
    }
}

function startMonitoring(){
    if(monitoring) return;

    monitoring=true;
    renderMonitorMeta();

    poll();
    monitorTimer=setInterval(poll,POLL_INTERVAL);
}

function stopMonitoring(){
    monitoring=false;

    if(monitorTimer){
        clearInterval(monitorTimer);
        monitorTimer=null;
    }

    renderMonitorMeta();
}

monitorBtn.addEventListener("click",()=>{
    if(monitoring) stopMonitoring();
    else startMonitoring();
});

clearLogBtn.addEventListener("click",()=>{
    const code=allyCode.value.replace(/\D/g,"");

    if(!code) return;

    if(!confirm("Очистить историю арены для этого Ally Code?")) return;

    history=[];
    localStorage.removeItem(getStorageKey(code));
    renderHistory();
});

arenaBtn.addEventListener("click",()=>request("/arena",renderArena));
profileBtn.addEventListener("click",()=>request("/profile",renderProfile));

allyCode.addEventListener("keydown",event=>{
    if(event.key==="Enter") request("/arena",renderArena);
});

allyCode.addEventListener("change",()=>{
    const code=allyCode.value.replace(/\D/g,"");

    if(code){
        loadHistory(code);
        lastSnapshot=null;
    }
});

copyBtn.addEventListener("click",async()=>{
    await navigator.clipboard.writeText(json.textContent);
    const old=copyBtn.textContent;
    copyBtn.textContent="Скопировано";
    setTimeout(()=>copyBtn.textContent=old,1200);
});

const initialCode=allyCode.value.replace(/\D/g,"");
if(initialCode) loadHistory(initialCode);
</script>
</body>
</html>
